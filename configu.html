<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indentidade da loja</title>
    <link rel="stylesheet" href="css/configu.css">
</head>
<body>
    <div class="PainelDoLojista">
    <h1>Painel do Lojista</h1>
  </div>
    
    <!-- Navegação entre telas do lojista -->
  <div class="divBarraNavegacao">
    <nav class="barra-nav">
      <a href="estoque.html" class="icone-estoque">📦</a>
      <a href="configu.html" class="icone-configuracao">⚙️</a>
      <a href="produtosCadastro.html" class="icone-cadastro">🛍️</a>
      <a href="dados.html" class="icone-dados">📊</a>
    </nav>
  </div>
  <h3 id="indentidadeTitulo">
            indentidade da loja
        </h3>
        <!--aqui tem a costomização da loja-->
        <div class="InputIndentidade">
            <label for="Nome da loja" id="nomeLoja">Nome da loja:</label>
         <input type="text" id="NomeLOJA" name="Nome" placeholder="Digite o nome da loja">
        </div>
        <!--escolher sobre oq a loja é-->
        <label for="segmento" id="Segmento">Segmento:</label>
         <div class="InputSegmento">
            

         <button id="Moda">Moda</button>
         <button id="SalaodeBeleza">Salão de Beleza</button>
         <br>
         <button id="Cosmeticos">Cosméticos</button>
         <button id="Perfumaria">Perfumaria</button>
        </div>
      <!--escolher cor da loja-->
        <div class="grid-cores">
  <div class="campo-cor">
    <label for="cor-principal">Cor principal</label>
    <div class="linha-cor">
      <input type="color" id="cor-principal" value="#0a0a0a">
      <input type="text" id="cor-principal-hex" value="#0A0A0A" maxlength="7">
    </div>
  </div>

  <div class="campo-cor">
    <label for="cor-destaque">Cor de destaque</label>
    <div class="linha-cor">
      <input type="color" id="cor-destaque" value="#c4a882">
      <input type="text" id="cor-destaque-hex" value="#C4A882" maxlength="7">
    </div>
  </div>
</div>
    
      <button id="SalvarBotaoconfigu"> Salvar alterações</button>
    
      <div class="previaLoja">
        <h3 id="previaTitulo">Prévia</h3>
      </div>
      <script src="js/painel.js"></script>
</body>
</html>
